version: "1.0.0"
project_name: "Engineering-as-Code (EoC) Framework"
description: "Global domain taxonomy, component names, system acronyms, and glossary for automated agents and human engineering teams."

domains:
  governance:
    description: "Internal project architecture, lifecycle artifacts, and decision logs"
    path: "arch/"
    categories:
      - id: "seed"
        description: "Exploratory discovery, business requirements, and product requirements (Project Initiative Documents)"
        artifacts: ["PID-OC", "PID-BR", "PID-PR", "PID-PD"]
      - id: "concept"
        description: "Exploratory proposals, RFCs, and spike evaluations"
        artifacts: ["RFC"]
      - id: "decisions"
        description: "Immutable architectural records"
        artifacts: ["ADR"]
      - id: "specs"
        description: "System topologies, data flows, and runtime boundaries"
        artifacts: ["SPEC"]
      - id: "design"
        description: "Low-level module design specifications and paired test specifications"
        artifacts: ["SDD", "TST"]

  implementation:
    description: "Production codebases and executable test harnesses"
    paths:
      source: "src/"
      tests: "tst/"
    subsystems:
      - name: "unit"
        path: "tst/unit/"
      - name: "functional"
        path: "tst/functional/"
      - name: "integration"
        path: "tst/integration/"

  consumption:
    description: "Project documentation, user manuals, and knowledge base. Specific subdirectory layout is defined in .eoc/profile/project.yaml."
    path: "doc/"

glossary:
  - term: "Docs-as-Code"
    definition: "Treating documentation with the same engineering rigor as source code, utilizing version control, review pipelines, and automated checks."
  - term: "Engineering-as-Code (EoC)"
    definition: "An extension of Docs-as-Code that governs the entire engineering lifecycle from strategy through architecture, design, testing, and implementation using machine-navigable artifacts."
  - term: "PID (Project Initiative Document)"
    definition: "The unified seed artifact sequence (PID-XXXX-OC, PID-XXXX-BR, PID-XXXX-PR, PID-XXXX-PD) that chronologically orders discovery, business guardrails, product requirements, and project decisions under arch/01-seed/."
  - term: "Test Twin"
    definition: "The paired test specification document (TST-XXXX) that must be born alongside every software design document (SDD-XXXX) under arch/05-design/."
  - term: "Immutability Principle"
    definition: "The rule that accepted Architecture Decision Records (ADRs) can never be edited; changes require a new ADR that explicitly supersedes the older record."
